[labels]
app.name = Help

# Error messages used by a.error.label(...).
errors.not_logged_in = Not logged in
errors.invalid_kind = Invalid kind
errors.help_not_configured = Help is not configured for this server
errors.body_is_required = Please add a bit more detail before submitting
errors.body_too_long = Your message is too long
errors.title_is_required = Please give your post a title
errors.title_too_long = Your title is too long
errors.no_fingerprint_returned = The destination did not return a fingerprint
errors.unknown_document = Unknown document
errors.remote_failed = Remote request failed
errors.service_unavailable = The submission service is temporarily unavailable. Please try again later.

# Error keys the forums / projects apps can return through prepare and
# contribute; _surface_remote_error and _remote_error_message resolve them
# against this catalog, so each reachable key must exist here. English values
# match the source app's catalog so translation-memory fills stay exact.
errors.invalid_id = Invalid ID
errors.invalid_project_id = Invalid project ID
errors.forum_not_found = Forum not found
errors.forum_not_found_in_directory = Forum not found in directory
errors.not_allowed_to_post = Not allowed to post
errors.project_not_found = Project not found
errors.access_denied = Access denied
errors.you_own_this_project = You own this project
errors.unable_to_find_project_in_directory = Unable to find project in directory
errors.remote = The remote server could not complete the request

# Post titles for "Introduce yourself" and "Ask a question". Resolved at post time;
# the user's name is interpolated via {name}. titles.someone is the fallback
# used when the user has no display name set.
titles.intro = Introducing {name}
titles.someone = Someone
