# pt-br overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through pt-br, then pt, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 12 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.no_fingerprint_returned = O destino não retornou uma impressão
titles.intro = Apresentando {name}
errors.body_too_long = Sua mensagem é muito longa
errors.title_too_long = Seu título é muito longo
errors.remote_failed = Falha na solicitação remota
errors.service_unavailable = O serviço de envio está temporariamente indisponível. Tente novamente mais tarde.
errors.invalid_project_id = ID do projeto inválido
errors.forum_not_found = Fórum não encontrado
errors.forum_not_found_in_directory = Fórum não encontrado no diretório
errors.not_allowed_to_post = Sem permissão para postar
errors.you_own_this_project = Você é dono deste projeto
errors.remote = O servidor remoto não conseguiu concluir a solicitação
